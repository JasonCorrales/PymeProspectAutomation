services:
  postgres:
    image: postgres:16-alpine
    container_name: pyme-prospects-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pyme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pyme_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pyme_prospects}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pyme} -d ${POSTGRES_DB:-pyme_prospects}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
